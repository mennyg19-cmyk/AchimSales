{% extends "base.html" %}
{% block title %}{{ page_title }}{% endblock %}
{% block container_class %}container-narrow{% endblock %}

{% block content %}
<div class="page-head">
    <a class="back-link" href="/"><i data-feather="arrow-left"></i> Reports</a>

    <p class="page-subtitle">{{ page_subtitle }}</p>

    <p>{{ later_note }}</p>
</div>
{% endblock %}
