{% extends "base.html" %}
{% block title %}Reports - Sales Reports{% endblock %}

{% block content %}
<div class="page-header">
    <div class="page-header-row">
        <div>
            <h1>Your Reports</h1>
            <p class="page-subtitle">Tap a report to get started</p>
        </div>
        <a href="{{ url_for('history') }}" class="btn btn-sm btn-outline" title="My History">
            <i data-feather="clock" style="width:15px;height:15px;"></i>
            <span class="history-label">History</span>
        </a>
    </div>
</div>

<div class="report-grid">
    {% for key, report in reports.items() %}
    <a href="{{ url_for('report_form', report_key=key) }}" class="report-card">
        <div class="report-card-icon">
            <i data-feather="{{ report.icon }}"></i>
        </div>
        <div class="report-card-body">
            <h3>{{ report.name }}</h3>
            <p>{{ report.description }}</p>
        </div>
        <div class="report-card-arrow">
            <i data-feather="chevron-right"></i>
        </div>
    </a>
    {% endfor %}
</div>
{% endblock %}
