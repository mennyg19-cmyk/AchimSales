{% extends "base.html" %}
{% block title %}Not Authorized{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-icon error-icon">
            <i data-feather="shield-off" width="48" height="48"></i>
        </div>
        <h1>Not Authorized</h1>
        <p class="login-subtitle">
            The account <strong>{{ email }}</strong> is not authorized to use this app.
        </p>
        <p class="login-subtitle">Please contact your administrator to request access.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-outline btn-lg btn-block">Try a Different Account</a>
    </div>
</div>
{% endblock %}
