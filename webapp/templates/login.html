{% extends "base.html" %}
{% block title %}Sign In - Sales Reports{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-icon">
            <i data-feather="bar-chart-2" width="48" height="48"></i>
        </div>
        <h1>Sales Reports</h1>
        <p class="login-subtitle">Sign in with your company account to access reports</p>
        <a href="{{ url_for('auth.login_start') }}" class="btn btn-primary btn-lg btn-block">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 21 21" style="margin-right: 8px; vertical-align: middle;">
                <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
            </svg>
            Sign in with Microsoft
        </a>
    </div>
</div>
{% endblock %}
