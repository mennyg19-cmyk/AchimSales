{% extends "base.html" %}
{% block title %}Select View - Sales Reports{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <a href="{{ url_for('reports.reports_list') }}" class="back-link" style="margin-bottom:12px;">
            <i data-feather="arrow-left"></i> Back
        </a>
        <div class="login-icon">
            <i data-feather="eye" width="48" height="48"></i>
        </div>
        <h1>Select View</h1>
        <p class="login-subtitle">Welcome, {{ user.name }}.</p>
        <p class="login-subtitle" style="font-size: 13px; color: var(--text-muted);">
            Choose how you want to view the app. You'll see exactly what that user sees.
        </p>

        <form method="POST" action="{{ url_for('auth.role_picker') }}" style="margin-bottom: 16px;">
            <input type="hidden" name="role" value="admin">
            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-bottom: 12px;">
                <i data-feather="shield" style="width:18px;height:18px;vertical-align:middle;margin-right:6px;"></i>
                View as Admin
            </button>
        </form>

        <form method="POST" action="{{ url_for('auth.role_picker') }}">
            <input type="hidden" name="role" value="salesman">
            <label class="form-label" for="salesmanKey" style="text-align: left;">View as Salesman:</label>
            <select name="salesman_key" id="salesmanKey" class="form-input form-select" style="margin-bottom: 12px;">
                {% if salesmen %}
                    {% for sm in salesmen %}
                    <option value="{{ sm.key }}">{{ sm.name }} ({{ sm.key }})</option>
                    {% endfor %}
                {% else %}
                    <option value="">No salesmen found</option>
                {% endif %}
            </select>
            <button type="submit" class="btn btn-outline btn-lg btn-block">
                <i data-feather="user" style="width:18px;height:18px;vertical-align:middle;margin-right:6px;"></i>
                View as Salesman
            </button>
        </form>

        <div style="margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border);">
            <a href="{{ url_for('auth.logout') }}" class="btn btn-sm" style="color: var(--text-muted);">
                Sign out
            </a>
        </div>
    </div>
</div>
{% endblock %}
