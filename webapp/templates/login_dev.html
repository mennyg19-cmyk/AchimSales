{% extends "base.html" %}
{% block title %}Dev Sign In - Sales Reports{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-icon">
            <i data-feather="bar-chart-2" width="48" height="48"></i>
        </div>
        <h1>Sales Reports</h1>
        <p class="login-subtitle" style="color: #f59e0b; font-weight: 600;">DEV MODE — Auth Bypassed</p>
        <p class="login-subtitle">Choose how you want to sign in:</p>

        <form method="POST" action="{{ url_for('auth.dev_login') }}" style="margin-bottom: 16px;">
            {% include "_form_protect.html" %}
            <input type="hidden" name="role" value="admin">
            <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-bottom: 12px;">
                Sign in as Admin
            </button>
        </form>

        <form method="POST" action="{{ url_for('auth.dev_login') }}">
            {% include "_form_protect.html" %}
            <input type="hidden" name="role" value="salesman">
            <label class="form-label" for="salesmanKey" style="text-align: left;">Sign in as Salesman:</label>
            <select name="salesman_key" id="salesmanKey" class="form-input form-select" style="margin-bottom: 12px;">
                {% for sm in salesmen %}
                <option value="{{ sm.key }}">{{ sm.name }}</option>
                {% endfor %}
            </select>
            <button type="submit" class="btn btn-outline btn-lg btn-block">
                Sign in as Salesman
            </button>
        </form>
    </div>
</div>
{% endblock %}
