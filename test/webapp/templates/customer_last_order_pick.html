{% extends "base.html" %}
{% block title %}{{ report.name }} &middot; Sales Reports (test){% endblock %}

{% block content %}
<a href="{{ url_for('reports.list_all') }}" class="back-link">
    <i data-feather="arrow-left" style="width:16px;height:16px;"></i>
    Reports
</a>

<div class="page-header">
    <h1>{{ report.name }}</h1>
    <p class="page-subtitle">Pick a customer to see their last invoiced order, ready for a store visit.</p>
</div>

<div class="detail-card">
    <div class="form-group">
        <label class="form-label" for="customerSearch">Customer</label>
        <input type="text" id="customerSearch" class="form-input"
               placeholder="Search by name or account&hellip;" autocomplete="off">
    </div>

    <div id="customerList" class="customer-pick-list" role="listbox" aria-label="Customers">
        <div class="empty-state" style="padding:16px;">
            <i data-feather="loader" width="22" height="22"></i>
            <p style="margin-top:8px;">Loading customers&hellip;</p>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function () {
    "use strict";

    var URL_PREFIX  = {{ URL_PREFIX|tojson }};
    var listUrl     = URL_PREFIX + "/report/customer-last-order/customers.json";
    var detailBase  = URL_PREFIX + "/report/customer-last-order/";

    var listEl   = document.getElementById("customerList");
    var searchEl = document.getElementById("customerSearch");

    var allCustomers = [];

    function escapeHtml(s) {
        return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function render(filterTerm) {
        var term = (filterTerm || "").trim().toLowerCase();
        var rows = allCustomers;
        if (term) {
            rows = rows.filter(function (c) {
                return (c.account || "").toLowerCase().indexOf(term) !== -1
                    || (c.name || "").toLowerCase().indexOf(term) !== -1;
            });
        }

        if (!rows.length) {
            listEl.innerHTML =
                '<div class="empty-state" style="padding:16px;">' +
                '<i data-feather="search" width="22" height="22"></i>' +
                '<p style="margin-top:8px;">No customers match.</p></div>';
            if (typeof feather !== "undefined") feather.replace();
            return;
        }

        var html = "";
        var max = Math.min(rows.length, 200);
        for (var i = 0; i < max; i++) {
            var c = rows[i];
            var url = detailBase + encodeURIComponent(c.account);
            html += '<a href="' + url + '" class="customer-pick-row">' +
                    '<span class="customer-pick-acct">' + escapeHtml(c.account) + '</span>' +
                    '<span class="customer-pick-name">' + escapeHtml(c.name || "") + '</span>' +
                    '</a>';
        }
        if (rows.length > max) {
            html += '<div class="customer-pick-more">' +
                    'Showing ' + max + ' of ' + rows.length + '. Refine your search to narrow down.' +
                    '</div>';
        }
        listEl.innerHTML = html;
    }

    function loadCustomers() {
        listEl.innerHTML =
            '<div class="empty-state" style="padding:16px;">' +
            '<i data-feather="loader" width="22" height="22"></i>' +
            '<p style="margin-top:8px;">Loading customers&hellip;</p></div>';
        if (typeof feather !== "undefined") feather.replace();

        fetch(listUrl, { credentials: "same-origin" })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                allCustomers = Array.isArray(data) ? data : [];
                allCustomers.sort(function (a, b) {
                    return (a.name || "").localeCompare(b.name || "");
                });
                if (!allCustomers.length) {
                    listEl.innerHTML =
                        '<div class="empty-state" style="padding:16px;">' +
                        '<p>No customers available. The reporting API may be unreachable.</p></div>';
                    return;
                }
                render(searchEl.value);
            })
            .catch(function () {
                listEl.innerHTML =
                    '<div class="empty-state" style="padding:16px;">' +
                    '<p>Could not load customers. Please try again.</p></div>';
            });
    }

    searchEl.addEventListener("input", function () { render(searchEl.value); });
    loadCustomers();
})();
</script>
{% endblock %}
