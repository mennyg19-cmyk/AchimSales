{% extends "base.html" %}
{% block title %}Reports &middot; v2{% endblock %}
{% block content %}
<section class="page">
    <div class="page-header">
        <h1>Reports</h1>
        <p class="page-subtitle">Tap a report to set filters and run it.</p>
    </div>

    <div class="reports-grid">
        {% for r in reports %}
        <a class="report-card" href="{{ url_for('reports.filter_form', report_key=r.key) }}">
            <h3>{{ r.name }}</h3>
            <p>{{ r.description }}</p>
            <span class="open-link">Open &rarr;</span>
        </a>
        {% endfor %}
    </div>
</section>
{% endblock %}
