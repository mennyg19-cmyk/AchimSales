name: Agent Guardrails

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Required for organization-owned repositories; not required for personal accounts.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  semgrep:
    name: Static scan (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      # Home site is v3/ (Flask). webapp/ is /legacy.
      # p/default also packs rules that do not match how this app is written:
      # Django CSRF looks for {% csrf_token %}, not Flask {{ csrf_token() }};
      # SQL rules flag SQLite execute() with ? params and f-string column
      # names; integrity wants CDN hashes; urllib flags Graph/Sabbath HTTP;
      # SHA1 is a cache fingerprint, not a password hash.
      - name: Run semgrep (Flask live app)
        run: >
          semgrep scan --config p/default --error v3
          --exclude-rule python.django.security.django-no-csrf-token.django-no-csrf-token
          --exclude-rule python.django.security.injection.tainted-sql-string.tainted-sql-string
          --exclude-rule python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
          --exclude-rule python.lang.security.audit.formatted-sql-query.formatted-sql-query
          --exclude-rule python.flask.security.injection.tainted-sql-string.tainted-sql-string
          --exclude-rule html.security.audit.missing-integrity.missing-integrity
          --exclude-rule python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
          --exclude-rule python.lang.security.insecure-hash-algorithms.insecure-hash-algorithm-sha1

  zizmor:
    name: GitHub Actions lint (zizmor)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d # v0.5.6
