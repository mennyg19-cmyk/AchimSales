name: CI

on:
  pull_request:
  push:
    branches:
      - webapp-cache
      - "cursor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-secrets:
    name: Forbid tracked session exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check index
        run: bash tools/check-no-tracked-secrets.sh

  p0-tests:
    name: P0 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install -r v3/requirements.txt
      - name: Run v3 containment tests
        working-directory: v3
        run: python -m pytest tests/test_odata_scope.py tests/test_config.py tests/test_smoke.py -q --tb=short
      - name: Run webapp bypass tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_dev_bypass_auth.py --noconftest -q --tb=short
