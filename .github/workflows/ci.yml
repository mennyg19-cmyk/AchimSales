name: CI

on:
  pull_request:
  push:
    branches:
      - webapp-cache
      - "cursor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-secrets:
    name: Forbid tracked session exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check index
        run: bash tools/check-no-tracked-secrets.sh

  p0-tests:
    name: P0 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install -r v3/requirements.txt
      - name: Run v3 containment tests
        working-directory: v3
        run: python -m pytest tests/test_odata_scope.py tests/test_config.py tests/test_smoke.py tests/test_precious_repair.py tests/test_session_authz.py tests/test_seed_users_grants.py -q --tb=short
      - name: Run webapp bypass tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/test_dev_bypass_auth.py tests/test_download_file_auth.py tests/test_security_headers.py tests/test_magic_link.py tests/test_magic_link_origin.py tests/test_excel_formula.py tests/test_legacy_session_authz.py --noconftest -q --tb=short
