name: CI

on:
  pull_request:
  push:
    branches:
      - webapp-cache
      - "cursor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tracked-secrets:
    name: Forbid tracked session exports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check index
        run: bash tools/check-no-tracked-secrets.sh

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: pip install -r v3/requirements.txt -r requirements.txt
      - name: v3 pytest
        run: |
          cd v3
          python -m pytest tests -q --tb=short
      - name: root pytest
        run: |
          PYTHONPATH="$PWD" python -m pytest tests -q --tb=short

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: v3/package-lock.json
      - name: Install and build
        working-directory: v3
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Generated JS/CSS matches the build
        run: git diff --exit-code -- v3/web/static_dist/js/*.js v3/web/static_dist/css/*.css
