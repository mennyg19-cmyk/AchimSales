# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - achim-sales-reports

# Production slot. Only `main` goes live.
# Cloud Agent `cursor/**` branches do not auto-deploy (that overwrote the site).
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Name bumped so the 2026-08-26 ghost "queued" runs (cannot cancel or delete)
# do not hold this lock forever. Still one production deploy at a time.
concurrency:
  group: deploy-achim-sales-reports-v2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required for actions/checkout.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build v3 static assets
        run: cd v3 && npm ci && npm run build

      - name: Validate deployed dependency lock
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install --require-hashes -r webapp/requirements.txt
          pip install pytest

      - name: Verify runtime artifact and static output
        run: |
          source antenv/bin/activate
          python -m pytest tools/test_build_runtime_artifact.py -q --noconftest
          python -m pytest tests/test_startup_site_alias.py -q
          cd v3 && python -m pytest tests/test_static_dist.py -q

      - name: Build allowlisted runtime artifact
        run: python tools/build_runtime_artifact.py --dest "$RUNNER_TEMP/runtime-artifact"

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: ${{ runner.temp }}/runtime-artifact

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'achim-sales-reports'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_6D8853607BB04851AE665DC4FA045E31 }}
