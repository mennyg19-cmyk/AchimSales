{% extends "base.html" %}
{% block title %}Sign in - Sales Reports{% endblock %}
{% block content %}
<section class="card card--narrow">
  <h1>Sign in</h1>
  <p class="muted">Use your company Microsoft account.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <a class="btn btn--primary" href="{{ url_for('auth.start', next=next) }}">Sign in with Microsoft</a>

  {% if dev_mode %}
  <form class="dev-login" method="post" action="{{ url_for('auth.dev_login') }}">
    <p class="muted">Developer mode: sign in as any email.</p>
    <input type="hidden" name="next" value="{{ next }}">
    <input type="email" name="email" placeholder="you@achimonline.com" required>
    <input type="text" name="name" placeholder="Display name (optional)">
    <button type="submit" class="btn">Dev sign in</button>
  </form>
  {% endif %}
</section>
{% endblock %}
