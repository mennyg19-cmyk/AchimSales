{% extends "base.html" %}
{% block title %}Reports{% endblock %}
{% block content %}
<section class="page">
  <h1 class="page__title">Reports</h1>
  {% if reports %}
  <div class="report-grid">
    {% for report in reports %}
    <a class="report-card" href="{{ url_for('reporting.report_view', report_key=report.report_key) }}">
      <span class="report-card__title">{{ report.title }}</span>
      <span class="report-card__go">Open &rarr;</span>
    </a>
    {% endfor %}
  </div>
  {% else %}
  <p class="muted">No reports are available yet.</p>
  {% endif %}
</section>
{% endblock %}
