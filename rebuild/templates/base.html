<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}Sales Reports{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="app-header">
    <a class="app-header__brand" href="{{ url_for('reporting.reports_home') }}">Sales Reports</a>
    <div class="app-header__tag">rebuild preview</div>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
